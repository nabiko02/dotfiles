##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Default workspace define for a specific monitor
workspace=1,monitor:eDP-1,default:true
workspace=2,monitor:DP-2,default:true
workspace=3,monitor:DP-1,default:true

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

######################
# Set float by default for specific applications
######################
windowrule = float on, match:class ^(.*dialog.*)$
windowrule = float on, size 100 500, match:class org.gnome.Calculator, match:title Calculator
windowrule = float on, match:class nm-connection-editor
windowrule = float on, match:class lxappearance
windowrule = float on, size 1600 500, center on, match:class org.pulseaudio.pavucontrol

######################
# Inhibit idle
######################
windowrule = idle_inhibit always, workspace 4, match:class teams-for-linux

######################
# Send app to workspace
######################

windowrule = workspace 2, match:class Brave-browser
windowrule = workspace 3, match:class discord*
windowrule = workspace 3, match:class zen
windowrule = workspace 3, match:class Google-chrome
windowrule = workspace 4, match:class Bitwarden


######################
# Intellij 
######################
windowrule = no_anim on, border_size 0, match:class ^.*(jetbrains).*$, match:float 1
windowrule = max_size 1150 650, match:class ^(pcmanfm|Thunar)$, match:float 1
windowrule = tag +filepicker, match:class ^Xdg-desktop-portal-gtk$, match:float 1

windowrule = min_size 1000 700, border_size 1, no_shadow 1, match:tag filepicker

windowrule = no_initial_focus on, match:class ^jetbrains-(?!toolbox), match:float 1
# center the pops excepting context menu
windowrule = move ((monitor_w*0.3)) ((monitor_h*0.3)), size (monitor_w*0.4) (monitor_h*0.4), match:class ^jetbrains-(?!toolbox), match:title ^(?!win.*), match:float 1

windowrule = float on, move ((monitor_w*0.5)) ((monitor_h*0.5)), match:title ^(.*Popup.*|.*Dialog.*|Find.*|Search.*)$

windowrule = size 900 600, match:class ^(jetbrains-.*)$, match:title ^(.*Popup.*)$
